[package]
name = "bee-format"
version.workspace = true
edition.workspace = true
description = ".bee v0 container — portable production core (blueprint §4c). Python beehive/beefile.py is the reference implementation; this crate must stay bit-exact against it."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.8"
claxon = "0.4"
flacenc = { version = "0.5", default-features = false }
crc32fast = "1"

[[bin]]
name = "bee"
path = "src/bin/bee.rs"
